<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Journey Generator — HR &amp; Payroll</title>
<style>
  :root{
    /* ── SD Worx merkkleuren — vervang door de exacte hex uit uw merkgids ──
       Signatuurkleuren SD Worx: paars, koraalrood en geel.                 */
    --brand:#4b2e83;      /* paars — structuur/hero            */
    --brand-2:#7b4fc0;    /* lichter paars                     */
    --accent:#ff4b4b;     /* koraalrood — accent/klanttaken    */
    --highlight:#ffc629;  /* geel — subtiele highlight          */
    --ink:#1d1b24; --muted:#6a6676; --line:#e4e1ec; --bg:#f6f4fb; --card:#fff;
    --ok:#16915b; --wij:#4b2e83; --u:#ff4b4b;
    --radius:16px; --shadow:0 10px 30px rgba(40,20,80,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1060px;margin:0 auto;padding:26px 20px 80px}
  header.top{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
  .logo{width:44px;height:44px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--brand),var(--accent));display:flex;align-items:center;
    justify-content:center;color:#fff;font-weight:800;font-size:20px;box-shadow:var(--shadow)}
  header.top h1{font-size:1.35rem;margin:0;letter-spacing:-.01em}
  header.top .sub{color:var(--muted);font-size:.9rem;margin-top:2px}
  .lang{margin-left:auto;display:inline-flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden;background:#fff}
  .lang button{border:none;background:none;padding:8px 16px;font-weight:700;color:var(--muted);cursor:pointer;font-size:.9rem}
  .lang button.on{background:var(--brand);color:#fff}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  #intake{padding:26px 26px 8px;margin-top:16px}
  .intro{color:var(--muted);margin:0 0 18px;max-width:74ch}
  .progressbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
  .progressbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .35s}
  .step{display:none;animation:fade .35s ease}
  .step.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .qnum{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .qtitle{font-size:1.3rem;margin:4px 0 4px;letter-spacing:-.01em}
  .qhelp{color:var(--muted);margin:0 0 18px;font-size:.95rem}
  label.field{display:block;margin:0 0 14px}
  label.field > span{display:block;font-weight:600;margin-bottom:6px;font-size:.95rem}
  input[type=text],input[type=number],input[type=date],input[type=email],select{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:1rem;
    font-family:inherit;background:#fff;color:var(--ink);transition:border .15s,box-shadow .15s}
  input:focus,select:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 4px rgba(123,79,192,.15)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  .choices{display:grid;gap:10px}
  .choices.row{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .pgroup{margin-top:18px}
  .pgroup .plabel{font-weight:700;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;color:var(--brand);margin-bottom:8px}
  .choice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);
    border-radius:12px;cursor:pointer;transition:.15s;background:#fff}
  .choice:hover{border-color:var(--brand-2);background:#faf8ff}
  .choice input{margin-top:3px;accent-color:var(--brand);width:17px;height:17px;flex:0 0 auto}
  .choice .c-title{font-weight:600;display:block}
  .choice .c-desc{color:var(--muted);font-size:.88rem}
  .choice.selected{border-color:var(--brand);background:#f4efff}
  .nav{display:flex;justify-content:space-between;gap:12px;padding:20px 0 6px}
  button.act{font-family:inherit;font-size:1rem;font-weight:600;border-radius:12px;border:1.5px solid transparent;padding:12px 22px;cursor:pointer;transition:.15s}
  .btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
  .btn-primary:hover{filter:brightness(1.07)}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--brand-2)}
  button.act:disabled{opacity:.45;cursor:not-allowed}

  #result{display:none;margin-top:16px}
  .result-hero{padding:28px 26px;background:linear-gradient(135deg,var(--brand),#3a2266);color:#fff;border-radius:var(--radius) var(--radius) 0 0}
  .result-hero .badge{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);
    padding:4px 12px;border-radius:99px;font-size:.78rem;font-weight:700;margin-bottom:10px}
  .result-hero h2{margin:0 0 4px;font-size:1.55rem;letter-spacing:-.01em}
  .result-hero p{margin:0;opacity:.9}
  .hero-meta{display:flex;flex-wrap:wrap;gap:20px;margin-top:18px}
  .hero-meta div{min-width:110px}
  .hero-meta .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
  .hero-meta .v{font-size:1.05rem;font-weight:700;margin-top:2px}
  .result-body{background:var(--card);border:1px solid var(--line);border-top:none;border-radius:0 0 var(--radius) var(--radius)}
  .legend{display:flex;gap:18px;padding:16px 26px 0;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
  .legend b{display:inline-flex;align-items:center;gap:6px}
  .legend .sw{width:12px;height:12px;border-radius:4px;display:inline-block}
  .rail{display:flex;overflow-x:auto;gap:0;padding:20px 26px 6px}
  .rail .node{flex:1 0 auto;min-width:132px;text-align:center;position:relative;padding-top:26px}
  .rail .node::before{content:"";position:absolute;top:14px;left:0;right:0;height:3px;background:var(--line)}
  .rail .node:first-child::before{left:50%}
  .rail .node:last-child::before{right:50%}
  .rail .dot{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;
    background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800;z-index:1}
  .rail .node .n-name{font-weight:700;font-size:.92rem}
  .rail .node .n-date{color:var(--muted);font-size:.78rem}
  .phase{padding:22px 26px;border-top:1px solid var(--line)}
  .phase-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .phase-ico{width:46px;height:46px;border-radius:12px;background:#f4efff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
  .phase-head h3{margin:0;font-size:1.2rem}
  .phase-head .p-sub{color:var(--muted);font-size:.9rem;margin-top:1px}
  .phase-head .p-when{margin-left:auto;text-align:right}
  .phase-head .p-when .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .phase-head .p-when .v{font-weight:700}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  @media(max-width:640px){.cols{grid-template-columns:1fr}.hero-meta div{min-width:100px}}
  .col{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fcfbff}
  .col.wij{border-top:3px solid var(--wij)}
  .col.u{border-top:3px solid var(--u)}
  .col h4{margin:0 0 10px;font-size:.95rem;display:flex;align-items:center;gap:8px}
  .col h4 .tag{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff}
  .col.wij .tag{background:var(--wij)}
  .col.u .tag{background:var(--u)}
  ul.tasks{list-style:none;margin:0;padding:0}
  ul.tasks li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:.93rem}
  ul.tasks li.t::before{content:"✓";color:var(--ok);font-weight:800;flex:0 0 auto}
  ul.tasks.client li input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:0 0 auto}
  .none{color:var(--muted);font-style:italic;font-size:.9rem}
  .summary{margin:22px 26px;border:1px solid var(--line);border-radius:12px;padding:18px 20px;background:#fff}
  .summary h3{margin:0 0 4px;font-size:1.1rem}
  .summary p.s-sub{margin:0 0 12px;color:var(--muted);font-size:.9rem}
  .summary ol{margin:0;padding-left:20px}
  .summary ol li{padding:4px 0}
  .summary .doclist{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .summary .doclist span{background:#f4efff;color:var(--brand);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.82rem;font-weight:600}
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:6px 26px 24px}
  .btn-soft{background:#f4efff;border-color:var(--line);color:var(--brand)}
  .btn-soft:hover{border-color:var(--brand-2)}
  .modetoggle{display:inline-flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden;background:#fff;margin-left:auto}
  .modetoggle button{border:none;background:none;padding:9px 16px;font-weight:600;color:var(--muted);cursor:pointer;font-size:.88rem}
  .modetoggle button.on{background:var(--brand);color:#fff}
  .loadbar{display:flex;justify-content:flex-end;margin:-6px 0 14px}
  .linkbtn{background:none;border:none;color:var(--brand);font-weight:600;font-size:.88rem;cursor:pointer;padding:6px 4px;text-decoration:underline}
  .foot{color:var(--muted);font-size:.82rem;text-align:center;margin-top:24px}
  @media print{
    body{background:#fff}
    .toolbar,.progressbar,#intake,.lang,header.top .sub{display:none!important}
    .card,.result-body,.result-hero{box-shadow:none;border-color:#ccc}
    .result-hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .phase{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">SD</div>
    <div>
      <h1 data-i18n="appTitle"></h1>
      <div class="sub" data-i18n="appSub"></div>
    </div>
    <div class="lang" role="group" aria-label="language">
      <button id="lang-nl" class="on" onclick="setLang('nl')">NL</button>
      <button id="lang-en" onclick="setLang('en')">EN</button>
    </div>
  </header>

  <!-- ============ INTAKE ============ -->
  <section id="intake" class="card">
    <p class="intro" data-i18n="intro"></p>
    <div class="loadbar">
      <button type="button" class="linkbtn" id="loadBtn" data-i18n="btn_load"></button>
      <input type="file" id="loadFile" accept="application/json,.json" style="display:none">
    </div>
    <div class="progressbar"><i id="bar"></i></div>
    <form id="qform" novalidate>

      <!-- 0 Klant -->
      <div class="step active" data-step="0">
        <div class="qnum"></div>
        <h2 class="qtitle" data-i18n="s0_title"></h2>
        <p class="qhelp" data-i18n="s0_help"></p>
        <label class="field"><span data-i18n="f_company"></span>
          <input type="text" id="company" data-i18n-ph="ph_company"></label>
        <div class="grid2">
          <label class="field"><span data-i18n="f_contact"></span>
            <input type="text" id="contact" data-i18n-ph="ph_contact"></label>
          <label class="field"><span data-i18n="f_email"></span>
            <input type="email" id="email" data-i18n-ph="ph_email"></label>
        </div>
      </div>

      <!-- 1 Product -->
      <div class="step" data-step="1">
        <div class="qnum"></div>
        <h2 class="qtitle" data-i18n="s_product_title"></h2>
        <p class="qhelp" data-i18n="s_product_help"></p>
        <div class="pgroup"><div class="plabel" data-i18n="pg_scope"></div>
          <div class="choices" id="scopeChoices"></div></div>
        <div class="pgroup" id="modelGroup"><div class="plabel" data-i18n="pg_model"></div>
          <div class="choices row" id="modelChoices"></div></div>
        <div class="pgroup" id="tierGroup"><div class="plabel" data-i18n="pg_tier"></div>
          <div class="choices row" id="tierChoices"></div></div>
      </div>

      <!-- 2 Omvang -->
      <div class="step" data-step="2">
        <div class="qnum"></div>
        <h2 class="qtitle" data-i18n="s1_title"></h2>
        <p class="qhelp" data-i18n="s1_help"></p>
        <div class="grid2">
          <label class="field"><span data-i18n="f_employees"></span>
            <input type="number" id="employees" min="1" step="1" data-i18n-ph="ph_employees"></label>
          <label class="field"><span data-i18n="f_entities"></span>
            <input type="number" id="entities" min="1" step="1" value="1"></label>
        </div>
        <label class="field"><span data-i18n="f_freq"></span>
          <select id="frequency">
            <option value="monthly" data-i18n="opt_monthly"></option>
            <option value="fourweekly" data-i18n="opt_fourweekly"></option>
          </select></label>
      </div>

      <!-- 3 Planning -->
      <div class="step" data-step="3">
        <div class="qnum"></div>
        <h2 class="qtitle" data-i18n="s2_title"></h2>
        <p class="qhelp" data-i18n="s2_help"></p>
        <label class="field"><span data-i18n="f_golive"></span>
          <input type="date" id="golive"></label>
      </div>

      <!-- 4 CAO -->
      <div class="step" data-step="4">
        <div class="qnum"></div>
        <h2 class="qtitle" data-i18n="s3_title"></h2>
        <p class="qhelp" data-i18n="s3_help"></p>
        <div class="choices" data-single="cao">
          <label class="choice"><input type="radio" name="cao" value="ja">
            <span><span class="c-title" data-i18n="c_cao_ja_t"></span><span class="c-desc" data-i18n="c_cao_ja_d"></span></span></label>
          <label class="choice"><input type="radio" name="cao" value="nee">
            <span><span class="c-title" data-i18n="c_cao_nee_t"></span><span class="c-desc" data-i18n="c_cao_nee_d"></span></span></label>
        </div>
        <label class="field" id="cao-name" style="display:none;margin-top:12px"><span data-i18n="f_caoName"></span>
          <input type="text" id="caoName" data-i18n-ph="ph_caoName"></label>
      </div>

      <!-- 5 Regelingen -->
      <div class="step" data-step="5">
        <div class="qnum"></div>
        <h2 class="qtitle" data-i18n="s4_title"></h2>
        <p class="qhelp" data-i18n="s4_help"></p>
        <div class="choices">
          <label class="choice"><input type="checkbox" id="pensioen">
            <span><span class="c-title" data-i18n="c_pens_t"></span><span class="c-desc" data-i18n="c_pens_d"></span></span></label>
          <label class="choice"><input type="checkbox" id="arbo">
            <span><span class="c-title" data-i18n="c_arbo_t"></span><span class="c-desc" data-i18n="c_arbo_d"></span></span></label>
          <label class="choice"><input type="checkbox" id="loonheffing">
            <span><span class="c-title" data-i18n="c_lh_t"></span><span class="c-desc" data-i18n="c_lh_d"></span></span></label>
        </div>
      </div>

      <!-- 6 Loonbestanddelen -->
      <div class="step" data-step="6">
        <div class="qnum"></div>
        <h2 class="qtitle" data-i18n="s5_title"></h2>
        <p class="qhelp" data-i18n="s5_help"></p>
        <div class="choices">
          <label class="choice"><input type="checkbox" id="dertiende">
            <span><span class="c-title" data-i18n="c_13_t"></span><span class="c-desc" data-i18n="c_13_d"></span></span></label>
          <label class="choice"><input type="checkbox" id="variabel">
            <span><span class="c-title" data-i18n="c_var_t"></span><span class="c-desc" data-i18n="c_var_d"></span></span></label>
          <label class="choice"><input type="checkbox" id="lease">
            <span><span class="c-title" data-i18n="c_lease_t"></span><span class="c-desc" data-i18n="c_lease_d"></span></span></label>
          <label class="choice"><input type="checkbox" id="onkosten">
            <span><span class="c-title" data-i18n="c_wkr_t"></span><span class="c-desc" data-i18n="c_wkr_d"></span></span></label>
          <label class="choice"><input type="checkbox" id="expat">
            <span><span class="c-title" data-i18n="c_expat_t"></span><span class="c-desc" data-i18n="c_expat_d"></span></span></label>
        </div>
      </div>

      <div class="nav">
        <button type="button" class="act btn-ghost" id="prev" disabled></button>
        <button type="button" class="act btn-primary" id="next"></button>
      </div>
    </form>
  </section>

  <!-- ============ RESULT ============ -->
  <section id="result">
    <div class="result-hero">
      <span class="badge" id="r-badge"></span>
      <h2 id="r-title"></h2>
      <p id="r-sub"></p>
      <div class="hero-meta" id="r-meta"></div>
    </div>
    <div class="result-body">
      <div class="legend">
        <b><span class="sw" style="background:var(--wij)"></span> <span data-i18n="leg_wij"></span></b>
        <b><span class="sw" style="background:var(--u)"></span> <span data-i18n="leg_u"></span></b>
      </div>
      <div class="rail" id="rail"></div>
      <div id="phases"></div>
      <div class="summary" id="summary"></div>
      <div class="toolbar">
        <button class="act btn-primary" onclick="window.print()" data-i18n="btn_print"></button>
        <button class="act btn-soft" id="exportHtml" data-i18n="btn_exporthtml"></button>
        <button class="act btn-soft" id="saveJson" data-i18n="btn_savejson"></button>
        <button class="act btn-ghost" id="restart" data-i18n="btn_restart"></button>
        <div class="modetoggle" role="group" aria-label="date mode">
          <button id="mode-months" class="on" onclick="setDateMode('months')" data-i18n="mode_months"></button>
          <button id="mode-dates" onclick="setDateMode('dates')" data-i18n="mode_dates"></button>
        </div>
      </div>
    </div>
    <p class="foot" id="foot"></p>
  </section>
</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   ▛▟  EDIT HERE — CONTENT CONFIG  ▙▜
   Alles wat je als beheerder wilt aanpassen staat in dit CONFIG-blok:
   producten, fases, taken en de tweetalige teksten. De rest (de "engine"
   verderop) hoef je niet aan te raken.

   • Elke tekst is een object {nl:"...", en:"..."}  →  Nederlands + Engels.
   • Een taak = { who:"wij"|"u", text:{nl,en}, when:(a)=>true/false }
       - who:"wij" = taak implementatieteam · who:"u" = taak klant
       - when is optioneel; laat weg = taak altijd tonen.
         'a' bevat alle antwoorden (a.product, a.cao, a.pensioen, a.entities,
         a.employees, a.dertiende, a.expat, ... zie collect()).
       - text mag ook een functie zijn: (a)=>({nl,en}) voor dynamische tekst.
   • Een product bepaalt via 'when'-condities welke taken verschijnen; optioneel
     kun je met product.phases bepaalde fases weglaten voor dat product.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ---- PRODUCTEN (SD Worx-portfolio) ----
   Structuur uit de bijlage:
     • Internationaal  → losstaand product (geen model/tier)
     • Lokaal          → model (MPS | BPO) → tier (Premium | Professional | Enterprise)
   Voorlopig alleen als LABEL op de deliverable; de taken per fase zijn (nog)
   voor elk product gelijk. Wil je later taken per product laten verschillen,
   voeg dan een when-conditie toe zoals: when:a=>a.product.model==="bpo"        */
const PRODUCT_SCOPES = [
  { id:"internationaal", hasSub:false,
    name:{nl:"Internationaal", en:"International"},
    desc:{nl:"Payroll in meerdere landen.", en:"Payroll across multiple countries."} },
  { id:"lokaal", hasSub:true,
    name:{nl:"Lokaal", en:"Local"},
    desc:{nl:"Payroll in één land.", en:"Payroll in a single country."} },
];
const PRODUCT_MODELS = [
  { id:"mps", name:{nl:"MPS", en:"MPS"}, desc:{nl:"Managed Payroll Services", en:"Managed Payroll Services"} },
  { id:"bpo", name:{nl:"BPO", en:"BPO"}, desc:{nl:"Business Process Outsourcing", en:"Business Process Outsourcing"} },
];
const PRODUCT_TIERS = [
  { id:"premium",      name:{nl:"Premium", en:"Premium"} },
  { id:"professional", name:{nl:"Professional", en:"Professional"} },
  { id:"enterprise",   name:{nl:"Enterprise", en:"Enterprise"} },
];

/* ---- FASES + TAKEN ---- */
const PHASES = [
  { key:"launch", icon:"🚀", name:"Launch",
    sub:{nl:"SharePoint & kick-off meeting", en:"SharePoint & kick-off meeting"},
    months:1,
    noneU:{nl:"Geen taken — u neemt alleen deel aan de kick-off", en:"No tasks — you only join the kick-off"},
    tasks:[
      {who:"wij", text:{nl:"Toegang tot de SharePoint-omgeving voorzien", en:"Provide access to the SharePoint environment"}},
      {who:"wij", text:{nl:"De kick-off meeting organiseren", en:"Organize the kick-off meeting"}},
    ]},

  { key:"discovery", icon:"🔍", name:"Discovery",
    sub:{nl:"Uitwisselen documentatie voor start setup", en:"Exchanging documentation to start setup"},
    months:1,
    tasks:[
      {who:"wij", text:{nl:"Ondersteunen bij het samenstellen van de documentatie voor de setup", en:"Support compiling the documentation for the setup"}},
      {who:"wij", when:a=>a.loonheffing, text:a=>a.entities>1

/* ---- PLANNING-REGELS (streeftijd per fase, in MAANDEN) ----
   Basis komt uit het Excel-implementatieplanning-template:
     Launch 1 · Discovery 1 · Set-up 2 · Test 1 · Go Live 1 · Aftercare 2  (= 8 mnd)
   Pas de 'months' per fase hierboven aan, of de opslagfactor hieronder.
   Voor grote/complexe klanten krijgt de Set-up een extra maand.            */
function phaseMonths(phase, a){
  let m = phase.months;
  if(phase.key==="setup"){
    if(a.employees>250 || a.entities>2) m += 1;           // grotere/complexere populatie
  }
  return m;
}

/* ═══════════════════════════════════════════════════════════════════════════

let LANG = "nl";
let ANSWERS = null;
let selectedScope = "lokaal", selectedModel = "bpo", selectedTier = "professional";
let dateMode = "months";  // "months" = streefmaanden per fase · "dates" = exacte data

const $ = s => document.querySelector(s);
const steps = [...document.querySelectorAll('.step')];
let cur = 0;

function tr(k){ return (T[k]&&T[k][LANG])||k; }
function L(x){ return x ? (x[LANG]||x.nl||"") : ""; }               // pick language from {nl,en}
function resolve(text,a){ return typeof text==="function" ? text(a) : text; }  // dynamic or static
const byId = (list,id) => list.find(x=>x.id===id) || list[0];
const phasesFor = () => PHASES;              // alle producten volgen (voorlopig) dezelfde fases
function currentProduct(){
  return selectedScope==="lokaal"
    ? {scope:"lokaal", model:selectedModel, tier:selectedTier}
    : {scope:"internationaal", model:null, tier:null};
}
function productLabel(prod){
  if(!prod) return "";
  const parts = [L(byId(PRODUCT_SCOPES, prod.scope).name)];
  if(prod.scope==="lokaal"){
    parts.push(L(byId(PRODUCT_MODELS, prod.model).name));
    parts.push(L(byId(PRODUCT_TIERS, prod.tier).name));
  }
  return parts.join(" · ");
}

function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent = tr(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder = tr(el.dataset.i18nPh));
  document.querySelectorAll('.qnum').forEach(el=>{ const i=+el.closest('.step').dataset.step; el.textContent = tr('qword')+" "+(i+1); });
  $('#prev').textContent = tr('prev');
  $('#next').textContent = cur===steps.length-1 ? tr('generate') : tr('next');
  renderProductOptions();
  document.documentElement.lang = LANG;
}
function radioHTML(name,items,sel){
  return items.map(it=>`<label class="choice${it.id===sel?' selected':''}">
      <input type="radio" name="${name}" value="${it.id}" ${it.id===sel?'checked':''}>
      <span><span class="c-title">${esc(L(it.name))}</span>${it.desc?`<span class="c-desc">${esc(L(it.desc))}</span>`:''}</span></label>`).join('');
}
function markSel(inp){ inp.closest('.choices').querySelectorAll('.choice').forEach(c=>c.classList.remove('selected')); inp.closest('.choice').classList.add('selected'); }
function renderProductOptions(){
  $('#scopeChoices').innerHTML = radioHTML('scope', PRODUCT_SCOPES, selectedScope);
  $('#modelChoices').innerHTML = radioHTML('model', PRODUCT_MODELS, selectedModel);
  $('#tierChoices').innerHTML  = radioHTML('tier',  PRODUCT_TIERS,  selectedTier);
  const lokaal = selectedScope==="lokaal";
  $('#modelGroup').style.display = lokaal ? 'block' : 'none';
  $('#tierGroup').style.display  = lokaal ? 'block' : 'none';
  $('#scopeChoices').querySelectorAll('input').forEach(i=>i.addEventListener('change',()=>{ selectedScope=i.value; renderProductOptions(); }));
  $('#modelChoices').querySelectorAll('input').forEach(i=>i.addEventListener('change',()=>{ selectedModel=i.value; markSel(i); }));
  $('#tierChoices').querySelectorAll('input').forEach(i=>i.addEventListener('change',()=>{ selectedTier=i.value; markSel(i); }));
}
function setLang(l){
  LANG=l; $('#lang-nl').classList.toggle('on',l==='nl'); $('#lang-en').classList.toggle('on',l==='en');
  applyI18n();
  if(ANSWERS && $('#result').style.display==='block') renderResult(ANSWERS);
}
function setDateMode(m){
  dateMode=m; $('#mode-months').classList.toggle('on',m==='months'); $('#mode-dates').classList.toggle('on',m==='dates');
  if(ANSWERS && $('#result').style.display==='block') renderResult(ANSWERS);
}
function whenLabel(p){
  if(dateMode==='dates'){
    const lastDay=new Date(p._end.getTime()-86400000);
    return esc(fmt(p._start))+' – '+esc(fmt(lastDay));
  }
  return esc(monthsLabel(p._months));   // duur, bv. "1 maand" / "2 maanden"
}
function monthsLabel(n){ return n+' '+(n===1?tr('t_month_1'):tr('t_month_n')); }

function show(i){
  steps.forEach(s=>s.classList.toggle('active',+s.dataset.step===i));
  cur=i; $('#bar').style.width=(i/(steps.length-1))*100+'%';
  $('#prev').disabled=i===0; $('#next').textContent=i===steps.length-1?tr('generate'):tr('next');
}
$('#next').addEventListener('click',()=>{ if(!validate(cur))return; if(cur===steps.length-1)doGenerate(); else show(cur+1); });
$('#prev').addEventListener('click',()=>show(Math.max(0,cur-1)));
function validate(i){
  if(i===0 && !$('#company').value.trim()){ $('#company').focus(); flash($('#company')); return false; }
  if(i===2){ const n=+$('#employees').value; if(!n||n<1){ $('#employees').focus(); flash($('#employees')); return false; } }
  if(i===4 && !document.querySelector('input[name=cao]:checked')){ flash($('[data-single=cao]')); return false; }
  return true;
}
function flash(el){ el.animate([{boxShadow:'0 0 0 4px rgba(230,0,126,.35)'},{boxShadow:'0 0 0 4px rgba(230,0,126,0)'}],{duration:600}); }

document.querySelectorAll('.choice input').forEach(inp=>{
  inp.addEventListener('change',()=>{
    if(inp.type==='radio'){ inp.closest('.choices').querySelectorAll('.choice').forEach(c=>c.classList.remove('selected')); inp.closest('.choice').classList.add('selected'); }
    else inp.closest('.choice').classList.toggle('selected',inp.checked);
    if(inp.name==='cao') $('#cao-name').style.display = inp.value==='ja'?'block':'none';
  });
});
document.querySelectorAll('.choice input:checked').forEach(i=>i.closest('.choice').classList.add('selected'));

function addMonths(d,n){ return new Date(d.getFullYear(), d.getMonth()+n, 1); }   // altijd 1e v/d maand
function fmt(d){ return d.toLocaleDateString(LANG==='nl'?'nl-NL':'en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function monthFmt(d){ return d.toLocaleDateString(LANG==='nl'?'nl-NL':'en-GB',{month:'short',year:'numeric'}); }

function collect(){
  return {
    company:$('#company').value.trim(), contact:$('#contact').value.trim(), email:$('#email').value.trim(),
    product: currentProduct(),
    employees:+$('#employees').value, entities:Math.max(1,+$('#entities').value||1),
    frequency:$('#frequency').value, golive:$('#golive').value,
    cao:document.querySelector('input[name=cao]:checked')?.value==='ja', caoName:$('#caoName').value.trim(),
    pensioen:$('#pensioen').checked, arbo:$('#arbo').checked, loonheffing:$('#loonheffing').checked,
    dertiende:$('#dertiende').checked, variabel:$('#variabel').checked, lease:$('#lease').checked,
    onkosten:$('#onkosten').checked, expat:$('#expat').checked,
  };
}

/* build one phase's task lists from config */
function buildPhase(phase,a){
  const wij=[], u=[];
  (phase.tasks||[]).forEach(tk=>{
    if(tk.when && !tk.when(a)) return;
    const txt = L(resolve(tk.text,a));
    (tk.who==='wij'?wij:u).push(txt);
  });
  return {wij,u};
}

function doGenerate(){ ANSWERS=collect(); renderResult(ANSWERS); $('#intake').style.display='none'; $('#result').style.display='block'; window.scrollTo({top:0,behavior:'smooth'}); }

function renderResult(a){
  const phases = phasesFor(a).map(p=>({...p}));
  let cursor;
  const totalMonths = phases.reduce((s,p)=>s+phaseMonths(p,a),0);
  if(a.golive){
    const gd = new Date(a.golive+"T00:00:00");
    const beforeGolive = phases.slice(0, phases.findIndex(p=>p.key==='golive'))
                               .reduce((s,p)=>s+phaseMonths(p,a),0);
    cursor = new Date(gd.getFullYear(), gd.getMonth()-beforeGolive, 1);   // 1e v/d startmaand
  } else { const n=new Date(); cursor = new Date(n.getFullYear(), n.getMonth(), 1); }
  let mi=1;
  phases.forEach(p=>{ const n=phaseMonths(p,a); p._months=n; p._mStart=mi; p._mEnd=mi+n-1; mi+=n;
    p._start=new Date(cursor); cursor=addMonths(cursor,n); p._end=new Date(cursor); });

  $('#r-badge').textContent = productLabel(a.product);
  $('#r-title').textContent = tr('r_title')+a.company;
  $('#r-sub').textContent = tr('r_sub') + (a.contact ? tr('r_attn')+a.contact : "");
  const meta = [
    [tr('m_employees'), a.employees], [tr('m_entities'), a.entities], [tr('m_phases'), phases.length],
    [tr('m_duration'), totalMonths+" "+tr('m_months')],
  ];
  if(a.golive) meta.push([tr('m_golive'), fmt(new Date(a.golive+"T00:00:00"))]);   // streefdatum go-live
  $('#r-meta').innerHTML = meta.map(m=>`<div><div class="k">${esc(m[0])}</div><div class="v">${esc(m[1])}</div></div>`).join('');
  $('#rail').innerHTML = phases.map((p,i)=>`<div class="node"><div class="dot">${i+1}</div>
      <div class="n-name">${p.icon} ${esc(p.name)}</div>
      <div class="n-date">${dateMode==='dates'?esc(fmt(p._start)):esc(monthsLabel(p._months))}</div></div>`).join('');

  const clientActions=[];
  $('#phases').innerHTML = phases.map((p,i)=>{
    const b = buildPhase(p,a);
    const wijLi = b.wij.map(x=>`<li class="t">${esc(x)}</li>`).join('') || `<li class="none">${esc(tr('none_generic'))}</li>`;
    let uLi;
    if(b.u.length===0){ uLi = `<li class="none">${esc(p.noneU?L(p.noneU):tr('none_generic'))}</li>`; }
    else uLi = b.u.map(x=>{ clientActions.push({phase:p.name,task:x}); return `<li><input type="checkbox"> <span>${esc(x)}</span></li>`; }).join('');
    const phLabel = tr('ph_of').replace('%n',i+1).replace('%t',phases.length);
    return `<div class="phase"><div class="phase-head"><div class="phase-ico">${p.icon}</div>
        <div><h3>${esc(phLabel)}: ${esc(p.name)}</h3><div class="p-sub">${esc(L(p.sub))}</div></div>
        <div class="p-when"><div class="k">${esc(tr('p_indic'))}</div><div class="v">${whenLabel(p)}</div></div></div>
      <div class="cols">
        <div class="col wij"><h4><span class="tag">WIJ</span> ${esc(tr('h_wij'))}</h4><ul class="tasks">${wijLi}</ul></div>
        <div class="col u"><h4><span class="tag">U</span> ${esc(tr('h_u'))}</h4><ul class="tasks client">${uLi}</ul></div>
      </div></div>`;
  }).join('');

  const docs=[]; docs.push(LANG==='nl'?"Documentatie voor de setup":"Setup documentation");
  if(a.cao) docs.push(a.caoName || (LANG==='nl'?"cao-informatie":"CAO information"));
  if(a.pensioen) docs.push(LANG==='nl'?"Pensioenregeling":"Pension scheme");
  if(a.arbo) docs.push(LANG==='nl'?"Gegevens arbodienst":"Occupational-health details");
  if(a.expat) docs.push(LANG==='nl'?"Expat / 30%-info":"Expat / 30% info");

  const list = clientActions.map(x=>`<li><strong>${esc(x.phase)}:</strong> ${esc(x.task)}</li>`).join('');
  $('#summary').innerHTML = `<h3>${esc(tr('sum_h'))}</h3>
    <p class="s-sub">${esc(tr('sum_sub').replace('%c',a.company))}</p>
    <ol>${list||`<li class="none">${esc(tr('sum_none'))}</li>`}</ol>
    <div style="font-weight:600;margin-top:14px;font-size:.9rem">${esc(tr('sum_docs'))}</div>
    <div class="doclist">${docs.map(d=>`<span>${esc(d)}</span>`).join('')}</div>`;

  $('#foot').textContent = tr('foot').replace('%d', new Date().toLocaleDateString(LANG==='nl'?'nl-NL':'en-GB',{day:'numeric',month:'long',year:'numeric'}));
  document.querySelectorAll('#phases .tasks.client li input').forEach(cb=>cb.addEventListener('change',()=>{
    const s=cb.nextElementSibling; s.style.textDecoration=cb.checked?'line-through':'none'; s.style.opacity=cb.checked?'.5':'1'; }));
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
$('#restart').addEventListener('click',()=>{ $('#result').style.display='none'; $('#intake').style.display='block'; show(0); window.scrollTo({top:0,behavior:'smooth'}); });

/* ---- opslaan / laden / exporteren ---- */
function slug(s){ return (String(s||'journey').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''))||'journey'; }
function download(name,content,type){
  const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob);
  const el=document.createElement('a'); el.href=url; el.download=name; document.body.appendChild(el); el.click(); el.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function saveJson(){ if(!ANSWERS) return; download('journey-'+slug(ANSWERS.company)+'.json', JSON.stringify(ANSWERS,null,2), 'application/json'); }
function exportHtml(){
  if(!ANSWERS) return;
  const style=document.querySelector('style').innerHTML;
  const clone=$('#result').cloneNode(true);
  clone.querySelectorAll('.toolbar').forEach(e=>e.remove());   // interactieve knoppen weg
  clone.style.display='block';
  const doc='<!doctype html><html lang="'+LANG+'"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width, initial-scale=1">'+
    '<title>'+esc(tr('exp_title'))+' — '+esc(ANSWERS.company)+'</title><style>'+style+'</style></head>'+
    '<body><div class="wrap">'+clone.outerHTML+'</div></body></html>';
  download('journey-'+slug(ANSWERS.company)+'.html', doc, 'text/html');
}
$('#saveJson').addEventListener('click',saveJson);
$('#exportHtml').addEventListener('click',exportHtml);
$('#loadBtn').addEventListener('click',()=>$('#loadFile').click());
$('#loadFile').addEventListener('change',ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ applyAnswers(JSON.parse(r.result)); }catch(e){ alert(LANG==='nl'?'Ongeldig JSON-bestand.':'Invalid JSON file.'); } };
  r.readAsText(f); ev.target.value='';
});
function setChk(id,v){ const el=$('#'+id); if(el) el.checked=!!v; }
function applyAnswers(a){
  $('#company').value=a.company||''; $('#contact').value=a.contact||''; $('#email').value=a.email||'';
  const pr=a.product||{}; selectedScope=pr.scope||'lokaal'; selectedModel=pr.model||'bpo'; selectedTier=pr.tier||'professional';
  renderProductOptions();
  $('#employees').value=a.employees||''; $('#entities').value=a.entities||1;
  $('#frequency').value=a.frequency||'monthly'; $('#golive').value=a.golive||'';
  const caoR=document.querySelector('input[name=cao][value='+(a.cao?'ja':'nee')+']');
  if(caoR){ caoR.checked=true; caoR.dispatchEvent(new Event('change')); }
  $('#caoName').value=a.caoName||'';
  ['pensioen','arbo','loonheffing','dertiende','variabel','lease','onkosten','expat'].forEach(k=>setChk(k,a[k]));
  document.querySelectorAll('.choice input[type=checkbox]').forEach(inp=>inp.closest('.choice').classList.toggle('selected',inp.checked));
  doGenerate();
}

applyI18n();
show(0);
</script>
</body>
</html>
